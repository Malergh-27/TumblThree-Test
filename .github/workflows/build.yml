name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore packages
      run: nuget restore src\TumblThree\TumblThree.sln

    - name: Build (Release x64)
      run: msbuild src\TumblThree\TumblThree.sln /p:UseSharedCompilation=false /t:Build /p:Platform="x64" /p:Configuration="Release" /m

    - name: Upload app
      uses: actions/upload-artifact@v4
      with:
        name: TumblThree-x64
        path: src\TumblThree\TumblThree.Presentation\bin\x64\Release\
